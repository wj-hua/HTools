plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mino.clipboard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mino.clipboard'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
